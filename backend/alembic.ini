# Alembic configuration file for NoteFlow
# The sqlalchemy.url is overridden in alembic/env.py using DATABASE_URL from settings.

[alembic]
# Path to migration scripts
script_location = migrations

# Template for new migration file names
# %(rev)s          Revision ID
# %(slug)s         Abbreviated revision message
# %(epoch)s        Epoch timestamp
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps in migration file names
timezone = UTC

# Prepend sys.path with the backend directory so app imports resolve
prepend_sys_path = .

# SQLAlchemy URL placeholder – overridden by env.py at runtime
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/noteflow

# Truncate long revision messages in file names to this many chars
truncate_slug_length = 40

# Whether to allow .pyc files when scanning version directories
sourceless = false

# Version path separator; use os (default), colon, semicolon, or space
version_path_separator = os

# Output encoding for SQL scripts in offline mode
output_encoding = utf-8


[post_write_hooks]
# Optional: run black/isort on generated migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
